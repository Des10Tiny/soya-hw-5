apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: default
      defaultDatabase: default
      tlsSkipVerify: true
    secureJsonData:
      password: ""
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    isDefault: false
    url: postgres:5432
    user: postgres
    database: analytics
    jsonData:
      sslmode: disable
    secureJsonData:
      password: postgres
    editable: true
